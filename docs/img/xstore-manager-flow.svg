<svg viewBox="0 0 960 400" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <radialGradient id="bgGlow2" cx="45%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#9b51e0" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#9b51e0" stop-opacity="0"/>
    </radialGradient>
    <filter id="panelGlow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#9b51e0" flood-opacity="0.3"/>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="960" height="400" fill="#100d14"/>
  <rect width="960" height="400" fill="url(#bgGlow2)"/>

  <!-- ===== Top loop: audit adjusts the plan ===== -->
  <path d="M888 112 C 888 70, 850 60, 700 60 H 200 C 140 60, 116 80, 116 106" fill="none" stroke="#7b2cbf" stroke-width="1.3" stroke-dasharray="4 4"/>
  <path d="M116 112 l -4 -6 h 8 z" fill="#7b2cbf"/>
  <text x="500" y="52" font-size="9" text-anchor="middle" fill="#c08cf2" font-family="Consolas, Menlo, monospace">edit profile</text>

  <!-- ===== Panel 1: human, day zero ===== -->
  <text x="116" y="100" font-size="9" letter-spacing="1.5" text-anchor="middle" fill="#746a80" font-weight="600">GAME LIBRARY</text>
  <rect x="32" y="115" width="168" height="170" rx="12" fill="#1a1521" stroke="#382c47" filter="url(#softShadow)"/>
  <circle cx="116" cy="152" r="12" fill="none" stroke="#a99db6" stroke-width="2"/>
  <path d="M98 184 a 18 11 0 0 1 36 0" fill="none" stroke="#a99db6" stroke-width="2"/>
  <text x="116" y="214" font-size="14" font-weight="700" text-anchor="middle" fill="#f4eff9" font-family="Montserrat, Segoe UI, Arial, sans-serif">Choose game</text>
  <text x="116" y="234" font-size="9.5" text-anchor="middle" fill="#a99db6">Xbox libraries</text>
  <text x="116" y="248" font-size="9.5" text-anchor="middle" fill="#a99db6">manual folders</text>

  <!-- ===== Panel 2: agents run the board ===== -->
  <text x="432" y="100" font-size="9" letter-spacing="1.5" text-anchor="middle" fill="#746a80" font-weight="600">GAME PROFILE</text>
  <rect x="232" y="105" width="400" height="190" rx="14" fill="#15111b" stroke="#7b2cbf" stroke-width="1.5" filter="url(#panelGlow)"/>

  <rect x="252" y="135" width="100" height="54" rx="9" fill="#211a2b" stroke="#382c47"/>
  <text x="302" y="157" font-size="11" font-weight="600" text-anchor="middle" fill="#f4eff9">Select DLC</text>
  <text x="302" y="172" font-size="8" text-anchor="middle" fill="#a99db6" font-family="Consolas, Menlo, monospace">Store IDs</text>

  <rect x="382" y="135" width="100" height="54" rx="9" fill="#211a2b" stroke="#382c47"/>
  <text x="432" y="157" font-size="11" font-weight="600" text-anchor="middle" fill="#f4eff9">Validate</text>
  <text x="432" y="172" font-size="8" text-anchor="middle" fill="#a99db6" font-family="Consolas, Menlo, monospace">blocks and paths</text>

  <rect x="512" y="135" width="100" height="54" rx="9" fill="#211a2b" stroke="#382c47"/>
  <text x="562" y="157" font-size="11" font-weight="600" text-anchor="middle" fill="#f4eff9">Apply</text>
  <text x="562" y="172" font-size="8" text-anchor="middle" fill="#a99db6" font-family="Consolas, Menlo, monospace">backups first</text>

  <path d="M352 162 h20" stroke="#a99db6" stroke-width="1.5"/>
  <path d="M378 162 l -6 -4 v 8 z" fill="#a99db6"/>
  <path d="M482 162 h20" stroke="#a99db6" stroke-width="1.5"/>
  <path d="M508 162 l -6 -4 v 8 z" fill="#a99db6"/>

  <path d="M562 189 C 562 212, 432 212, 432 196" fill="none" stroke="#ff665c" stroke-width="1.2" stroke-dasharray="3 3"/>
  <path d="M432 190 l -4 6 h 8 z" fill="#ff665c"/>
  <text x="497" y="216" font-size="8" text-anchor="middle" fill="#ff665c" font-family="Consolas, Menlo, monospace">rollback</text>

  <rect x="248" y="238" width="112" height="20" rx="10" fill="#e07b51" fill-opacity="0.1" stroke="#e07b51" stroke-opacity="0.6"/>
  <text x="304" y="251" font-size="8.5" text-anchor="middle" fill="#e07b51" font-family="Consolas, Menlo, monospace">blacklist</text>
  <rect x="376" y="238" width="112" height="20" rx="10" fill="#c08cf2" fill-opacity="0.1" stroke="#c08cf2" stroke-opacity="0.6"/>
  <text x="432" y="251" font-size="8.5" text-anchor="middle" fill="#c08cf2" font-family="Consolas, Menlo, monospace">runtime version</text>
  <rect x="504" y="238" width="112" height="20" rx="10" fill="#66d17a" fill-opacity="0.1" stroke="#66d17a" stroke-opacity="0.6"/>
  <text x="560" y="251" font-size="8.5" text-anchor="middle" fill="#66d17a" font-family="Consolas, Menlo, monospace">rollback</text>

  <text x="432" y="280" font-size="8.5" text-anchor="middle" fill="#746a80" font-family="Consolas, Menlo, monospace">saved per game</text>

  <!-- ===== Panel 3: output ===== -->
  <text x="740" y="100" font-size="9" letter-spacing="1.5" text-anchor="middle" fill="#746a80" font-weight="600">GAME FOLDER</text>
  <rect x="672" y="115" width="136" height="170" rx="12" fill="#1a1521" stroke="#382c47" filter="url(#softShadow)"/>
  <rect x="684" y="136" width="112" height="26" rx="6" fill="#211a2b" stroke="#2c2338"/>
  <text x="740" y="153" font-size="8.5" text-anchor="middle" fill="#a99db6" font-family="Consolas, Menlo, monospace">proxy DLL</text>
  <rect x="684" y="170" width="112" height="26" rx="6" fill="#211a2b" stroke="#2c2338"/>
  <text x="740" y="187" font-size="8.5" text-anchor="middle" fill="#a99db6" font-family="Consolas, Menlo, monospace">original runtime</text>
  <rect x="684" y="204" width="112" height="26" rx="6" fill="#211a2b" stroke="#2c2338"/>
  <text x="740" y="221" font-size="8.5" text-anchor="middle" fill="#a99db6" font-family="Consolas, Menlo, monospace">selected INI</text>
  <text x="740" y="256" font-size="8" text-anchor="middle" fill="#66d17a" font-family="Consolas, Menlo, monospace">tracked hashes</text>

  <!-- ===== Panel 4: human, on return ===== -->
  <text x="888" y="100" font-size="9" letter-spacing="1.5" text-anchor="middle" fill="#746a80" font-weight="600">RESTORE</text>
  <rect x="840" y="115" width="96" height="170" rx="12" fill="#1a1521" stroke="#382c47" filter="url(#softShadow)"/>
  <circle cx="888" cy="152" r="12" fill="none" stroke="#a99db6" stroke-width="2"/>
  <path d="M870 184 a 18 11 0 0 1 36 0" fill="none" stroke="#a99db6" stroke-width="2"/>
  <text x="888" y="214" font-size="14" font-weight="700" text-anchor="middle" fill="#f4eff9" font-family="Montserrat, Segoe UI, Arial, sans-serif">Restore</text>
  <text x="888" y="234" font-size="9.5" text-anchor="middle" fill="#a99db6">original files</text>

  <!-- ===== Flow arrows ===== -->
  <path d="M200 200 h20" stroke="#a99db6" stroke-width="1.5"/>
  <path d="M226 200 l -6 -4 v 8 z" fill="#a99db6"/>
  <path d="M632 200 h28" stroke="#a99db6" stroke-width="1.5"/>
  <path d="M666 200 l -6 -4 v 8 z" fill="#a99db6"/>
  <path d="M808 200 h20" stroke="#a99db6" stroke-width="1.5"/>
  <path d="M834 200 l -6 -4 v 8 z" fill="#a99db6"/>

  <!-- ===== Bottom bracket ===== -->
  <path d="M232 320 v8 H808 v-8" fill="none" stroke="#66d17a" stroke-width="1.2"/>
  <text x="520" y="346" font-size="9.5" text-anchor="middle" fill="#66d17a" font-family="Consolas, Menlo, monospace">per-game settings · tracked files · reversible changes</text>
</svg>
